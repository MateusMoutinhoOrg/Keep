AgnosConfig:
  order: 1
  dir: true
  description: written once by `start`, read by every `build`
sandbox:
  order: 2
  dir: true
  description: "closed: imports nothing outside sandbox/, no OS packages"
  children:
    new.go:
      order: 1
      gen: true
      description: New(deps) *api.Sandbox, one <x>.Constructor per dir of constructors/
    api:
      order: 2
      dir: true
      description: contracts only; imports nothing but sandbox/deps
      children:
        sandbox.go:
          order: 1
          gen: true
          description: every <x>sandbox.go part embedded, plus Config and Deps
        projectsandbox.go:
          order: 2
          description: the Databases and Info fields Keep adds to the Sandbox
        databases.go:
          order: 3
          description: the Databases contract, plus Props, Schema, Field, Error and the objects a database hands back
        info.go:
          order: 4
          description: the Info contract - the library's own name and version
    constructors:
      order: 3
      dir: true
      description: one Constructor per field of the Sandbox, each called by new.go
    deps:
      order: 4
      dir: true
      description: one dir per capability the sandbox needs from outside; each imports nothing at all
      children:
        deps.go:
          order: 1
          gen: true
          description: one field per sub-directory, title-cased
        storagedeps:
          order: 2
          dir: true
          description: the single-key storage backend - the whole of what Keep asks of one
    internal:
      order: 5
      dir: true
      description: the logic; unreachable from outside the sandbox
      children:
        generated:
          order: 1
          dir: true
          description: (gen) the config, ProjectName and Version from AgnosConfig/project.yaml
        databases:
          order: 2
          dir: true
          description: NewDatabases, and the Database a Props is bound to
        collection:
          order: 3
          dir: true
          description: one collection - insert, find, list
        record:
          order: 4
          dir: true
          description: one record - read, update, remove, and the nested collections under it
        dense:
          order: 5
          dir: true
          description: the key layout and value encoding of the dense record pattern
        liberror:
          order: 6
          dir: true
          description: the constructors every *api.Error is built by
        info:
          order: 7
          dir: true
          description: NewInfo
adapters:
  order: 3
  dir: true
  description: the only place OS-bound and third-party code lives
  children:
    impls:
      order: 1
      dir: true
      description: one dir per adapter, each exporting Bind and carrying an adapter.yaml
      children:
        filestorage:
          order: 1
          dir: true
          description: storagedeps over one file per key
        memstorage:
          order: 2
          dir: true
          description: storagedeps over a map, lost when the process exits
    bindings:
      order: 2
      dir: true
      description: one dir per selection of adapters; new.go beside each is generated from its binding.yaml
      children:
        standard:
          order: 1
          dir: true
          description: filestorage - what a program that wants a database on disk imports
        memory:
          order: 2
          dir: true
          description: memstorage - the same library with nothing written anywhere
examples:
  order: 4
  dir: true
  description: one dir per example under lib/, each a package main checked against its golden
  children:
    lib:
      order: 1
      dir: true
      description: "<name>/example.go + props.yaml, and the result.yaml run-examples writes"
docs:
  order: 5
  dir: true
  description: one dir per doc, holding doc.md + doc.yaml. README.md indexes them all
go.mod:
  order: 6
  description: written by `start`; add-dep and remove-dep edit its require block
README.md:
  order: 7
  gen: true
  description: "`render AgnosConfig/docs/ReadmeHeader.md` + the documentation index"
